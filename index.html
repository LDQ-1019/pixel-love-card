<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>默契大测试</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap');

:root{
  --pink-bg:#FFDCEA;
  --pink-bg2:#FFC2DD;
  --pink-dark:#FF5C9B;
  --pink-darker:#E6307E;
  --pink-mid:#FF8FB9;
  --pink-light:#FFC9DE;
  --ink:#7A2E57;
  --ink-soft:#C48BA6;
  --white:#FFF9FB;
  --pixel-shadow:3px 3px 0 rgba(230,30,120,.20);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--pink-bg) 0%,var(--pink-bg2) 100%);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:none;
}

/* 漂浮爱心装饰 */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.deco span{position:absolute;font-size:14px;opacity:.5;animation:floatUp linear infinite;}
@keyframes floatUp{
  0%{transform:translateY(100vh) rotate(0);opacity:0;}
  10%{opacity:.6;}
  90%{opacity:.4;}
  100%{transform:translateY(-10vh) rotate(360deg);opacity:0;}
}

.screen{
  position:relative;z-index:1;height:100%;width:100%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:20px 16px;text-align:center;
}
.card{
  background:transparent;
  border:none;border-radius:0;
  padding:30px 24px;
  box-shadow:none;
  width:100%;max-width:380px;
  position:relative;
  animation:popIn .4s steps(4) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:none;}}
#s-step .card,#s-done .card{animation:none;}

/* 像素画框 */
.pixel-frame{
  width:180px;height:150px;margin:0 auto 16px;
  border:4px solid var(--pink-dark);
  background:linear-gradient(135deg,#FFF5F9,#FFE0EE);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:var(--pixel-shadow);
  overflow:hidden;
}
.pixel-frame::before,.pixel-frame::after{content:"✿";position:absolute;font-size:18px;color:var(--pink-mid);z-index:2;}
.pixel-frame::before{top:-10px;left:-10px;}
.pixel-frame::after{bottom:-10px;right:-10px;}
.pixel-frame .big{font-size:64px;filter:drop-shadow(2px 2px 0 rgba(230,30,120,.25));}

.title{font-size:22px;font-weight:bold;color:var(--pink-darker);line-height:1.5;margin-bottom:4px;}
.subtitle{font-size:14px;color:var(--ink-soft);margin-top:6px;line-height:1.7;}

/* 像素按钮 */
.pbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  border:3px solid var(--pink-darker);
  background:var(--pink-dark);color:var(--white);
  font-family:inherit;font-size:18px;font-weight:bold;
  padding:14px 34px;cursor:pointer;
  box-shadow:var(--pixel-shadow);
  border-radius:0;
  transition:transform .1s steps(2),box-shadow .1s;
}
.pbtn:disabled{opacity:.55;cursor:not-allowed;}
.pbtn-back{background:var(--pink-light);color:var(--pink-darker);flex:1;}

/* 逐题页 */
#s-step{display:none;overflow-y:auto;}
#s-step .card{max-width:380px;margin:0 auto;text-align:left;padding:26px 22px 30px;}
.progress{
  font-size:13px;color:var(--ink-soft);margin-bottom:12px;text-align:center;
  font-family:"Press Start 2P",monospace;
}
.progress .cur{color:var(--pink-darker);}
.label{
  font-size:19px;color:var(--pink-darker);font-weight:bold;line-height:1.7;
  text-align:center;margin:4px 0 22px;
}
.step-body .field{
  width:100%;border:3px solid var(--pink-dark);background:var(--white);
  color:var(--ink);padding:12px;font-size:16px;font-family:inherit;
  outline:none;border-radius:0;
}
.step-body input.field{height:50px;}
.step-body textarea.field{min-height:130px;resize:vertical;line-height:1.7;}
.step-body .field:focus{border-color:var(--pink-darker);}
.step-body .hint{font-size:13px;color:var(--ink-soft);margin-top:8px;text-align:center;}
.step-nav{display:flex;gap:12px;margin-top:24px;}
.step-nav .pbtn-next{flex:2;}
.send-status{margin-top:14px;font-size:14px;line-height:1.6;text-align:center;}
.send-fail{color:#C44;}
.send-fail a{color:#C44;font-weight:bold;word-break:break-all;}

/* 结尾页 */
#s-done{display:none;}
.done-heart{font-size:52px;margin:6px 0;filter:drop-shadow(2px 2px 0 rgba(230,30,120,.25));}
.final-dialog{
  background:var(--white);border:3px solid var(--pink-dark);
  box-shadow:var(--pixel-shadow);
  padding:22px 20px;margin:16px auto 8px;max-width:380px;
  text-align:left;
}
.final-dialog p{font-size:16px;line-height:1.8;color:var(--ink);margin-bottom:14px;}
.final-dialog .resp{color:var(--pink-mid);font-style:italic;}
.final-dialog .mono{color:var(--pink-darker);font-weight:bold;}
.done-note{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.replay{display:block;margin:16px auto 0;font-size:13px;color:var(--pink-mid);border:none;background:none;cursor:pointer;text-decoration:underline;}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
.confetti i{position:absolute;top:-10px;width:10px;height:16px;animation:confFall linear forwards;}
@keyframes confFall{0%{transform:translateY(-10vh) rotate(0);opacity:1;}100%{transform:translateY(108vh) rotate(720deg);opacity:0;}}
</style>
</head>
<body>
<div class="deco" id="deco"></div>

<!-- 1 开场页 -->
<section class="screen" id="s-intro">
  <div class="card">
    <div class="pixel-frame"><span class="big">❤</span></div>
    <h1 class="title">默契大测试</h1>
    <p class="subtitle">下面有 6 道题，不用多想，<br>如实回答就好。<br>你答完，答案会悄悄回到我这里。<br>猜对几题，就看我们有没有缘分啦。</p>
    <div style="margin-top:24px;">
      <button class="pbtn" id="startBtn">开始答题 →</button>
    </div>
  </div>
</section>

<!-- 2 逐题答题页 -->
<section class="screen" id="s-step">
  <div class="card">
    <div class="progress">第 <span class="cur" id="progCur">1</span> / <span id="progTotal">7</span> 步</div>
    <p class="label" id="stepLabel">先告诉我，怎么称呼你呢？</p>
    <div class="step-body">
      <input class="field" id="nickInput" type="text" placeholder="写下你的名字或昵称" style="display:none">
      <textarea class="field" id="answerInput" placeholder="这里写你的答案…" style="display:none"></textarea>
    </div>
    <p class="hint" id="stepHint"></p>
    <div class="step-nav">
      <button class="pbtn pbtn-back" id="stepBack">← 上一题</button>
      <button class="pbtn pbtn-next" id="stepNext">下一题 →</button>
    </div>
    <div class="send-status" id="sendStatus"></div>
  </div>
</section>

<!-- 3 结尾页 -->
<section class="screen" id="s-done">
  <div class="card">
    <div class="done-heart">❤</div>
    <h1 class="title">答案收到啦</h1>
    <div class="final-dialog">
      <p>你还记得咱俩第一次见面是什么时候吗？</p>
      <p class="resp">不记得啦</p>
      <p class="mono">那是在138亿年前，当宇宙还是一个小小的点，我们身体的所有元素都来自这个点爆炸散落的万千星辰。所以严格地说，138亿年前，我们就已经见过了。</p>
    </div>
    <p class="done-note">你的每一题答案，都已经送到我这里了。</p>
    <button class="replay" id="replayBtn">再看一次</button>
  </div>
</section>

<script>
(function(){
  var RECEIVE_EMAIL='3551469980@qq.com';
  var FORM_ENDPOINT='https://formsubmit.co/ajax/'+RECEIVE_EMAIL;

  // ---- 6 道开放式题目(想改文字改这里) ----
  var QUESTIONS=[
    "你喜欢出去玩还是宅在家里？",
    "你的农历生日是？",
    "你的理想男孩应该是什么样的？什么性格？",
    "你最喜欢吃什么？",
    "如果只能选一个城市一起生活，你会选哪？",
    "如果我给你打视频电话，你会同意吗？"
  ];

  // 漂浮爱心装饰
  (function(){
    var icons=['♥','✿','❀','🌸','♡'];
    var box=document.getElementById('deco');
    for(var i=0;i<30;i++){
      var s=document.createElement('span');
      s.textContent=icons[Math.floor(Math.random()*icons.length)];
      s.style.cssText='left:'+(Math.random()*100)+'%;animation-duration:'+(7+Math.random()*8)+'s;animation-delay:'+(Math.random()*12)+'s;font-size:'+(12+Math.random()*10)+'px;';
      box.appendChild(s);
    }
  })();

  function confetti(){
    var c=document.createElement('div');c.className='confetti';
    var colors=['#FF6FA5','#FF9EC8','#FFD166','#8FD694','#BFA6CC'];
    for(var i=0;i<36;i++){
      var e=document.createElement('i');
      e.style.cssText='left:'+(Math.random()*100)+'%;background:'+colors[Math.floor(Math.random()*colors.length)]+';animation-duration:'+(2+Math.random()*2.5)+'s;animation-delay:'+(Math.random()*.6)+'s;';
      c.appendChild(e);
    }
    document.body.appendChild(c);
    setTimeout(function(){c.remove();},5000);
  }

  function show(id){
    var screens=['s-intro','s-step','s-done'];
    screens.forEach(function(sid){
      document.getElementById(sid).style.display=(sid===id)?'flex':'none';
    });
  }

  // ---- 步骤定义：第1步是称呼，之后每题一步 ----
  var steps=[{k:'name',label:'先告诉我，怎么称呼你呢？',ph:'写下你的名字或昵称'}];
  QUESTIONS.forEach(function(q){ steps.push({k:'q',label:q}); });

  var cur=0;
  var nickEl=document.getElementById('nickInput');
  var ansEl=document.getElementById('answerInput');
  var labelEl=document.getElementById('stepLabel');
  var progCur=document.getElementById('progCur');
  var progTotal=document.getElementById('progTotal');
  var hintEl=document.getElementById('stepHint');
  var backBtn=document.getElementById('stepBack');
  var nextBtn=document.getElementById('stepNext');
  var sendStatus=document.getElementById('sendStatus');
  var answers={};
  progTotal.textContent=steps.length;

  function render(){
    progCur.textContent=(cur+1);
    var st=steps[cur];
    labelEl.textContent=st.label;
    if(st.k==='name'){
      nickEl.style.display='block';ansEl.style.display='none';
      hintEl.textContent='写个称呼就好，我会记得是你。';
    }else{
      nickEl.style.display='none';ansEl.style.display='block';
      ansEl.value=answers[cur]||'';
      answerInput.focus();
      hintEl.textContent='第 '+cur+' 题，想到什么写什么。';
    }
    backBtn.style.visibility=(cur===0)?'hidden':'visible';
    nextBtn.textContent=(cur===steps.length-1)?'答完了，送给你 💌':'下一题 →';
  }

  function next(){
    var st=steps[cur];
    if(st.k==='name'){ answers[cur]=nickEl.value.trim(); }
    else{ answers[cur]=ansEl.value.trim(); }
    if(cur<steps.length-1){
      cur++;
      sendStatus.className='send-status';sendStatus.textContent='';
      nextBtn.disabled=false;nextBtn.textContent='下一题 →';
      render();
    }else{
      submit();
    }
  }

  function back(){
    if(cur>0){ cur--; sendStatus.className='send-status';sendStatus.textContent=''; render(); }
  }

  function submit(){
    var nick=answers[0]||'（未留名）';
    var full='';
    for(var i=1;i<steps.length;i++){
      var v=answers[i]||'';
      full+='Q'+(i)+'. '+QUESTIONS[i-1]+'\n答：'+(v||'（没写）')+'\n\n';
    }
    var txt='怎么称呼：'+nick+'\n\n'+full;
    nextBtn.disabled=true;nextBtn.textContent='发送中…';
    sendStatus.className='send-status';sendStatus.textContent='';

    var payload={
      _subject:'【默契大测试】'+nick+' 答完啦 ❤',
      _captcha:'false',
      _template:'table',
      '称呼':nick,
      'Q1':answers[1],'Q2':answers[2],'Q3':answers[3],
      'Q4':answers[4],'Q5':answers[5],'Q6':answers[6],
      message:txt
    };

    fetch(FORM_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(payload)
    }).then(function(r){return r.json();}).then(function(d){
      if(d && d.success==='false'){ throw new Error(d.message||'发送失败'); }
      confetti();
      show('s-done');
    }).catch(function(){
      sendStatus.className='send-status send-fail';
      var mailto='mailto:'+RECEIVE_EMAIL+'?subject='+encodeURIComponent('【默契大测试】'+nick+'答完啦')+'&body='+encodeURIComponent(txt);
      sendStatus.innerHTML='没发送成功，也可以点这里用邮箱发到我这 👉 <a href="'+mailto+'">点此发送</a>';
      nextBtn.disabled=false;nextBtn.textContent='答完了，送给你 💌';
    });
  }

  document.getElementById('startBtn').onclick=function(){
    cur=0;render();
    document.getElementById('s-step').scrollTop=0;
    show('s-step');
  };
  nextBtn.onclick=next;
  backBtn.onclick=back;

  document.getElementById('replayBtn').onclick=function(){
    cur=0;answers={};
    nickEl.value='';ansEl.value='';
    sendStatus.className='send-status';sendStatus.textContent='';
    nextBtn.disabled=false;
    show('s-intro');
  };

  show('s-intro');
})();
</script>
</body>
</html>
