<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>默契大测试</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap');

:root{
  --pink-bg:#FFDCEA;
  --pink-bg2:#FFC2DD;
  --pink-dark:#FF5C9B;
  --pink-darker:#E6307E;
  --pink-mid:#FF8FB9;
  --pink-light:#FFC9DE;
  --ink:#7A2E57;
  --ink-soft:#C48BA6;
  --white:#FFF9FB;
  --win-gray:#F6EAF1;
  --win-blue:#FF7DB0;
  --win-blue-dark:#E86FA0;
  --pixel-shadow:3px 3px 0 rgba(230,30,120,.20);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--pink-bg) 0%,var(--pink-bg2) 100%);
  color:var(--ink);
  overflow:hidden;
  image-rendering:pixelated;
  -webkit-font-smoothing:none;
}

/* 像素花朵/爱心装饰 */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.deco span{position:absolute;font-size:14px;opacity:.5;animation:floatUp linear infinite;}
@keyframes floatUp{
  0%{transform:translateY(100vh) rotate(0);opacity:0;}
  10%{opacity:.6;}
  90%{opacity:.4;}
  100%{transform:translateY(-10vh) rotate(360deg);opacity:0;}
}

.screen{
  position:relative;z-index:1;height:100%;width:100%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:20px 16px;text-align:center;
}
.card{
  background:transparent;
  border:none;
  border-radius:0;
  padding:30px 24px;
  box-shadow:none;
  width:100%;max-width:380px;
  position:relative;
  animation:popIn .4s steps(4) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:none;}}
/* 初始隐藏的页面卡片：避免入场动画卡在透明状态 */
#s-quiz .card,#s-done .card{animation:none;opacity:1;}

/* 像素画框 */
.pixel-frame{
  width:180px;height:150px;margin:0 auto 16px;
  border:4px solid var(--pink-dark);
  background:linear-gradient(135deg,#FFF5F9,#FFE0EE);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:var(--pixel-shadow);
  overflow:hidden;
}
.pixel-frame::before,.pixel-frame::after{
  content:"✿";position:absolute;font-size:18px;color:var(--pink-mid);z-index:2;
}
.pixel-frame::before{top:-10px;left:-10px;}
.pixel-frame::after{bottom:-10px;right:-10px;}
.pixel-frame .big{font-size:64px;filter:drop-shadow(2px 2px 0 rgba(230,30,120,.25));}

.title{font-size:22px;font-weight:bold;color:var(--pink-darker);line-height:1.5;margin-bottom:4px;}
.subtitle{font-size:14px;color:var(--ink-soft);margin-top:6px;line-height:1.7;}

/* 像素按钮 */
.pbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  border:3px solid var(--pink-darker);
  background:var(--pink-dark);color:var(--white);
  font-family:inherit;font-size:20px;font-weight:bold;
  padding:15px 40px;cursor:pointer;
  box-shadow:var(--pixel-shadow);
  border-radius:0;
  transition:transform .1s steps(2),box-shadow .1s;
  image-rendering:pixelated;
}
.pbtn:disabled{opacity:.55;cursor:not-allowed;}

/* 答题屏：整页可滚动 */
#s-quiz{display:none;overflow-y:auto;align-items:flex-start;justify-content:flex-start;}
#s-quiz .card{max-width:420px;margin:0 auto;text-align:left;padding:24px 20px 34px;}
.quiz-head{text-align:center;margin-bottom:4px;}
.quiz-head .title{font-size:20px;}
.quiz-head .subtitle{margin-bottom:18px;}
.name-row{margin:8px 0 18px;}
.name-row label{font-size:15px;color:var(--ink);display:block;margin-bottom:6px;font-weight:bold;}
.name-row input{
  width:100%;border:3px solid var(--pink-darker);background:var(--white);
  padding:11px 12px;font-size:16px;color:var(--ink);font-family:inherit;outline:none;
}
.q-item{margin-bottom:18px;}
.q-item .q-no{
  display:inline-block;background:var(--pink-dark);color:#fff;
  font-size:12px;padding:3px 8px;margin-right:6px;
  font-family:"Press Start 2P",monospace;
}
.q-item p{font-size:17px;color:var(--ink);font-weight:bold;margin:8px 0 8px;line-height:1.5;}
.q-item textarea{
  width:100%;border:3px solid var(--pink-dark);background:var(--white);
  color:var(--ink);padding:10px 12px;font-size:15px;font-family:inherit;
  outline:none;resize:vertical;min-height:58px;border-radius:0;
}
.q-item textarea:focus{border-color:var(--pink-darker);}
.quiz-hint{font-size:13px;color:var(--ink-soft);margin:2px 0 18px;line-height:1.6;}
.pbtn-send{width:100%;}

.send-status{margin-top:12px;font-size:14px;line-height:1.6;text-align:center;}
.send-fail{color:#C44;}
.send-fail a{color:#C44;font-weight:bold;word-break:break-all;}

/* 结尾页 */
#s-done{display:none;}
.done-heart{font-size:52px;margin:6px 0;filter:drop-shadow(2px 2px 0 rgba(230,30,120,.25));}
.final-dialog{
  background:var(--white);border:3px solid var(--pink-dark);
  box-shadow:var(--pixel-shadow);
  padding:22px 20px;margin:16px auto 8px;max-width:380px;
  text-align:left;
}
.final-dialog p{font-size:16px;line-height:1.8;color:var(--ink);margin-bottom:14px;}
.final-dialog .resp{color:var(--pink-mid);font-style:italic;}
.final-dialog .mono{color:var(--pink-darker);font-weight:bold;}
.done-note{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.replay{display:block;margin:16px auto 0;font-size:13px;color:var(--pink-mid);border:none;background:none;cursor:pointer;text-decoration:underline;}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
.confetti i{position:absolute;top:-10px;width:10px;height:16px;animation:confFall linear forwards;}
@keyframes confFall{0%{transform:translateY(-10vh) rotate(0);opacity:1;}100%{transform:translateY(108vh) rotate(720deg);opacity:0;}}
</style>
</head>
<body>
<div class="deco" id="deco"></div>

<!-- 1 开场页 -->
<section class="screen" id="s-intro">
  <div class="card">
    <div class="pixel-frame"><span class="big">❤</span></div>
    <h1 class="title">默契大测试</h1>
    <p class="subtitle">下面有 6 道题，不用多想，<br>如实回答就好。<br>你答完，答案会悄悄回到我这里。<br>猜对几题，就看我们有没有缘分啦。</p>
    <div class="btn-wrap" style="margin-top:24px;">
      <button class="pbtn" id="startBtn">开始答题 →</button>
    </div>
  </div>
</section>

<!-- 2 答题页 -->
<section class="screen" id="s-quiz">
  <div class="card">
    <div class="quiz-head">
      <h1 class="title">默契大测试</h1>
      <p class="subtitle">共 6 题，每题填一句真心话就好。</p>
    </div>
    <div class="name-row">
      <label for="nickInput">先告诉我，怎么称呼你呢？</label>
      <input id="nickInput" type="text" placeholder="写下你的名字或昵称">
    </div>
    <div id="quizList"></div>
    <p class="quiz-hint">写完就可以点下面的按钮啦，答案会直接送到我这里 ❤</p>
    <button class="pbtn pbtn-send" id="submitBtn">答完了，送给你 💌</button>
    <div class="send-status" id="sendStatus"></div>
  </div>
</section>

<!-- 3 结尾页 -->
<section class="screen" id="s-done">
  <div class="card">
    <div class="done-heart">❤</div>
    <h1 class="title">答案收到啦</h1>
    <div class="final-dialog">
      <p>你还记得咱俩第一次见面是什么时候吗？</p>
      <p class="resp">不记得啦</p>
      <p class="mono">那是在138亿年前，当宇宙还是一个小小的点，我们身体的所有元素都来自这个点爆炸散落的万千星辰。所以严格地说，138亿年前，我们就已经见过了。</p>
    </div>
    <p class="done-note">你的每一题答案，都已经送到我这里了。</p>
    <button class="replay" id="replayBtn">再看一次</button>
  </div>
</section>

<script>
(function(){
  var RECEIVE_EMAIL='3551469980@qq.com';
  var FORM_ENDPOINT='https://formsubmit.co/ajax/'+RECEIVE_EMAIL;

  // ---- 6 道开放式题目(想改文字改这里) ----
  var QUESTIONS=[
    "你喜欢出去玩还是宅在家里？",
    "你的农历生日是？",
    "你的理想男孩应该是什么样的？什么性格？",
    "你最喜欢吃什么？",
    "如果只能选一个城市一起生活，你会选哪？",
    "如果我给你打视频电话，你会同意吗？"
  ];

  // 漂浮爱心装饰
  (function(){
    var icons=['♥','✿','❀','🌸','♡'];
    var box=document.getElementById('deco');
    for(var i=0;i<30;i++){
      var s=document.createElement('span');
      s.textContent=icons[Math.floor(Math.random()*icons.length)];
      s.style.cssText='left:'+(Math.random()*100)+'%;animation-duration:'+(7+Math.random()*8)+'s;animation-delay:'+(Math.random()*12)+'s;font-size:'+(12+Math.random()*10)+'px;';
      box.appendChild(s);
    }
  })();

  function confetti(){
    var c=document.createElement('div');c.className='confetti';
    var colors=['#FF6FA5','#FF9EC8','#FFD166','#8FD694','#BFA6CC'];
    for(var i=0;i<36;i++){
      var e=document.createElement('i');
      e.style.cssText='left:'+(Math.random()*100)+'%;background:'+colors[Math.floor(Math.random()*colors.length)]+';animation-duration:'+(2+Math.random()*2.5)+'s;animation-delay:'+(Math.random()*.6)+'s;';
      c.appendChild(e);
    }
    document.body.appendChild(c);
    setTimeout(function(){c.remove();},5000);
  }

  function show(id){
    var screens=['s-intro','s-quiz','s-done'];
    screens.forEach(function(sid){
      document.getElementById(sid).style.display = (sid===id) ? '' : 'none';
    });
  }

  // 渲染题目
  var quizList=document.getElementById('quizList');
  QUESTIONS.forEach(function(q,i){
    var d=document.createElement('div');d.className='q-item';
    var head=document.createElement('div');
    head.style.cssText='display:flex;align-items:center;gap:8px;';
    var no=document.createElement('span');no.className='q-no';no.textContent=(i+1);
    var title=document.createElement('p');title.textContent=q;
    head.appendChild(no);head.appendChild(title);
    var ta=document.createElement('textarea');
    ta.placeholder='这里写你的答案…';
    d.appendChild(head);d.appendChild(ta);
    quizList.appendChild(d);
  });

  document.getElementById('startBtn').onclick=function(){
    document.getElementById('s-quiz').scrollTop=0;
    show('s-quiz');
  };

  var submitBtn=document.getElementById('submitBtn');
  var sendStatus=document.getElementById('sendStatus');

  submitBtn.onclick=function(){
    var nick=(document.getElementById('nickInput').value||'').trim()||'（未留名）';
    var qs=quizList.querySelectorAll('textarea');
    var answers={};var full='';
    var empty=0;
    QUESTIONS.forEach(function(q,i){
      var v=qs[i].value.trim();
      answers['Q'+(i+1)]=v;
      full+='Q'+(i+1)+'. '+q+'\n答：'+(v||'（没写）')+'\n\n';
      if(!v)empty++;
    });
    var txt='怎么称呼：'+nick+'\n\n'+full;
    submitBtn.disabled=true;submitBtn.textContent='发送中…';
    sendStatus.className='send-status';sendStatus.textContent='';

    var payload={
      _subject:'【默契大测试】'+nick+' 答完啦 ❤',
      _captcha:'false',
      _template:'table',
      '称呼':nick,
      'Q1':answers['Q1'],
      'Q2':answers['Q2'],
      'Q3':answers['Q3'],
      'Q4':answers['Q4'],
      'Q5':answers['Q5'],
      'Q6':answers['Q6'],
      message:txt
    };

    fetch(FORM_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(payload)
    }).then(function(r){return r.json();}).then(function(d){
      if(d && d.success==='false'){
        throw new Error(d.message||'发送失败');
      }
      confetti();
      show('s-done');
    }).catch(function(){
      sendStatus.className='send-status send-fail';
      var mailto='mailto:'+RECEIVE_EMAIL+'?subject='+encodeURIComponent('【默契大测试】'+nick+'答完啦')+'&body='+encodeURIComponent(txt);
      sendStatus.innerHTML='没发送成功，也可以点这里用邮箱发到我这 👉 <a href="'+mailto+'">点此发送</a>';
      submitBtn.disabled=false;submitBtn.textContent='再试一次 💌';
    });
  };

  document.getElementById('replayBtn').onclick=function(){
    document.getElementById('nickInput').value='';
    quizList.querySelectorAll('textarea').forEach(function(t){t.value='';});
    sendStatus.className='send-status';sendStatus.textContent='';
    submitBtn.disabled=false;submitBtn.textContent='答完了，送给你 💌';
    show('s-intro');
  };

  show('s-intro');
})();
</script>
</body>
</html>
