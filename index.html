<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>默契大测试</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5Bc6e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="默契测试">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<style>
:root{
  --sky1:#A8D8F0;
  --sky2:#EAF7FF;
  --sea:#5Bc6e0;
  --sea-deep:#2E9BC4;
  --lemon:#FFD966;
  --sand:#FFF7E6;
  --ink:#2C5F7C;
  --ink-soft:#7FA9BE;
  --white:#FFFFFF;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Baloo 2","Quicksand","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,#EFF9FF 100%);
  color:var(--ink);
  overflow:hidden;
}

/* 云朵 */
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.deco .c1{width:120px;height:34px;top:8%;left:8%;animation:drift 26s linear infinite;}
.deco .c1::before{width:70px;height:70px;left:20px;top:-34px;}
.deco .c1::after{width:60px;height:60px;right:10px;top:-26px;}
.deco .c2{width:96px;height:28px;top:16%;right:12%;animation:drift 34s linear infinite;}
.deco .c2::before{width:56px;height:56px;left:16px;top:-28px;}
.deco .c2::after{width:48px;height:48px;right:8px;top:-22px;}
.deco .c3{width:80px;height:24px;top:6%;left:55%;animation:drift 40s linear infinite;}
.deco .c3::before{width:46px;height:46px;left:12px;top:-24px;}
@keyframes drift{0%{transform:translateX(0);}100%{transform:translateX(60px);}}

.screen{
  position:relative;z-index:1;height:100%;width:100%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:24px 18px;text-align:center;
}

/* 开场页大图 */
.hero-img{
  width:100%;max-width:360px;height:auto;aspect-ratio:3/4;object-fit:cover;
  border-radius:24px;border:4px solid #fff;box-shadow:0 14px 34px rgba(46,155,196,.28);
  display:block;margin:0 auto 18px;
}

.card{
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(4px);
  border-radius:26px;
  padding:26px 22px;
  box-shadow:0 12px 30px rgba(46,155,196,.18);
  width:100%;max-width:380px;
  position:relative;
  border:2px solid rgba(255,255,255,.6);
}
.title{font-size:26px;font-weight:800;color:var(--sea-deep);line-height:1.4;margin-bottom:6px;}
.subtitle{font-size:15px;color:var(--ink-soft);line-height:1.8;margin-top:6px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:999px;
  background:linear-gradient(135deg,var(--sea) 0%,var(--sea-deep) 100%);
  color:#fff;font-family:inherit;font-size:18px;font-weight:700;
  padding:16px 40px;cursor:pointer;
  box-shadow:0 10px 22px rgba(46,155,196,.4);
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-back{background:#EAF3F8;color:var(--sea-deep);box-shadow:none;flex:1;}

/* 逐题页 */
#s-step{display:none;overflow-y:auto;}
#s-step .card{text-align:left;padding:24px 20px 28px;}
.progress{font-size:13px;color:var(--ink-soft);margin-bottom:12px;text-align:center;font-weight:600;}
.progress .cur{color:var(--sea-deep);font-weight:800;}
.label{font-size:20px;color:var(--sea-deep);font-weight:800;line-height:1.7;text-align:center;margin:4px 0 22px;}
.step-body .field{
  width:100%;border:2px solid #CFE6F2;background:#F8FCFF;color:var(--ink);
  padding:13px;font-size:16px;font-family:inherit;outline:none;border-radius:16px;
}
.step-body input.field{height:52px;}
.step-body textarea.field{min-height:132px;resize:vertical;line-height:1.7;}
.step-body .field:focus{border-color:var(--sea-deep);box-shadow:0 0 0 3px rgba(46,155,196,.15);}
.step-body .hint{font-size:13px;color:var(--ink-soft);margin-top:8px;text-align:center;}
.step-nav{display:flex;gap:12px;margin-top:24px;}
.step-nav .btn-next{flex:2;}
.send-status{margin-top:14px;font-size:14px;line-height:1.6;text-align:center;}
.send-fail{color:#d9764f;}

/* 结尾页 */
#s-done{display:none;}
.done-heart{font-size:46px;margin:4px 0; }
.final-dialog{
  background:#F8FCFF;border:2px solid #CFE6F2;border-radius:18px;
  padding:20px 18px;margin:16px auto 6px;max-width:380px;text-align:left;
}
.final-dialog p{font-size:15px;line-height:1.8;color:var(--ink);margin-bottom:14px;}
.final-dialog .resp{color:var(--sea-deep);font-weight:700;}
.final-dialog .mono{color:#D9764F;font-weight:700;}
.done-note{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.replay{display:block;margin:16px auto 0;font-size:14px;color:var(--sea-deep);border:none;background:none;cursor:pointer;text-decoration:underline;font-weight:600;}

/* 撒花 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
.confetti i{position:absolute;top:-10px;width:12px;height:12px;border-radius:50%;animation:confFall linear forwards;}
@keyframes confFall{0%{transform:translateY(-10vh) rotate(0);opacity:1;}100%{transform:translateY(108vh) rotate(720deg);opacity:0;}}
</style>
</head>
<body>
<div class="deco">
  <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
</div>

<!-- 0 登录页 -->
<section class="screen" id="s-login">
  <div class="card" style="max-width:380px;margin:auto;">
    <h1 class="title">专属秘密空间</h1>
    <p class="subtitle">输入专属账号密码<br>才能进来哦</p>
    <div style="margin-top:20px;display:flex;flex-direction:column;gap:12px;">
      <input class="field" type="text" id="userInput" placeholder="账号" style="text-align:center;height:48px;">
      <input class="field" type="password" id="pwInput" placeholder="密码" style="text-align:center;height:48px;">
    </div>
    <div style="margin-top:22px;">
      <button class="btn" id="pwBtn" style="width:100%;">进入 →</button>
    </div>
    <div class="send-status" id="pwMsg"></div>
  </div>
</section>

<!-- 1 开场页 -->
<section class="screen" id="s-intro">
  <div style="width:100%;max-width:380px;margin:0 auto;display:flex;flex-direction:column;align-items:center;">
    <img class="hero-img" src="opening.png" alt="海边">
    <div class="card">
      <h1 class="title">默契大测试</h1>
      <p class="subtitle">下面有 6 道题，不用多想，<br>想到什么就写什么。<br>我们会不会不谋而合，<br>等你说完就见分晓啦。</p>
      <div style="margin-top:22px;">
        <button class="btn" id="startBtn">开始答题 →</button>
      </div>
    </div>
  </div>
</section>

<!-- 2 逐题答题页 -->
<section class="screen" id="s-step">
  <div class="card" style="max-width:380px;margin:auto;">
    <div class="progress">第 <span class="cur" id="progCur">1</span> / <span id="progTotal">6</span> 题</div>
    <p class="label" id="stepLabel">第 1 题</p>
    <div class="step-body">
      <textarea class="field" id="answerInput" placeholder="这里写你的答案…" style="display:none"></textarea>
    </div>
    <p class="hint" id="stepHint"></p>
    <div class="step-nav">
      <button class="btn btn-back" id="stepBack">← 上一题</button>
      <button class="btn btn-next" id="stepNext">下一题 →</button>
    </div>
    <div class="send-status" id="sendStatus"></div>
  </div>
</section>

<!-- 3 结尾页 -->
<section class="screen" id="s-done">
  <div class="card">
    <div class="done-heart">🌊❤️</div>
    <h1 class="title">默契就是，不用说的那种懂</h1>
    <div class="final-dialog">
      <p>你还记得咱俩第一次见面是什么时候吗？</p>
      <p class="resp">不记得啦</p>
      <p class="mono">那是在138亿年前，当宇宙还是一个小小的点，我们身体的所有元素都来自这个点爆炸散落的万千星辰。所以严格地说，138亿年前，我们就已经见过了。</p>
      <p>答案对不对，其实不重要。<br>和你想到一块儿去，就是正确答案。</p>
    </div>
    <p class="done-note">谢谢你认真陪我解完这些题。</p>
    <button class="replay" id="replayBtn">再看一次</button>
  </div>
</section>

<script>
(function(){
  var RECEIVE_EMAIL='3551469980@qq.com';
  var FORM_ENDPOINT='https://formsubmit.co/ajax/'+RECEIVE_EMAIL;

  var QUESTIONS=[
    "你喜欢出去玩还是宅在家里？",
    "你的农历生日是？",
    "你的理想男孩应该是什么样的？什么性格？",
    "你最喜欢吃什么？",
    "如果只能选一个城市一起生活，你会选哪？",
    "如果我给你打视频电话，你会同意吗？"
  ];

  function confetti(){
    var c=document.createElement('div');c.className='confetti';
    var colors=['#A8D8F0','#FFD966','#FF8FB9','#8FD694','#BFA6CC'];
    for(var i=0;i<40;i++){
      var e=document.createElement('i');
      e.style.cssText='left:'+(Math.random()*100)+'%;background:'+colors[Math.floor(Math.random()*colors.length)]+';width:'+(9+Math.random()*8)+'px;height:'+(9+Math.random()*8)+'px;animation-duration:'+(2+Math.random()*2.5)+'s;animation-delay:'+(Math.random()*.6)+'s;';
      c.appendChild(e);
    }
    document.body.appendChild(c);
    setTimeout(function(){c.remove();},5000);
  }

  function show(id){
    var screens=['s-login','s-intro','s-step','s-done'];
    screens.forEach(function(sid){
      document.getElementById(sid).style.display=(sid===id)?'flex':'none';
    });
  }

  var steps=[];
  QUESTIONS.forEach(function(q){ steps.push({k:'q',label:q}); });

  var cur=0;
  var ansEl=document.getElementById('answerInput');
  var labelEl=document.getElementById('stepLabel');
  var progCur=document.getElementById('progCur');
  var progTotal=document.getElementById('progTotal');
  var hintEl=document.getElementById('stepHint');
  var backBtn=document.getElementById('stepBack');
  var nextBtn=document.getElementById('stepNext');
  var sendStatus=document.getElementById('sendStatus');
  var answers={};
  progTotal.textContent=steps.length;

  function render(){
    progCur.textContent=(cur+1);
    var st=steps[cur];
    labelEl.textContent='第 '+(cur+1)+' 题';
    ansEl.style.display='block';
    ansEl.value=answers[cur]||'';
    ansEl.focus();
    hintEl.textContent='第 '+(cur+1)+' 题，想到什么写什么。';
    backBtn.style.visibility=(cur===0)?'hidden':'visible';
    nextBtn.textContent=(cur===steps.length-1)?'答完了，送给你 💌':'下一题 →';
  }

  function next(){
    answers[cur]=ansEl.value.trim();
    if(cur<steps.length-1){
      cur++;
      sendStatus.className='send-status';sendStatus.textContent='';
      nextBtn.disabled=false;nextBtn.textContent='下一题 →';
      render();
    }else{
      submit();
    }
  }

  function back(){
    if(cur>0){ cur--; sendStatus.className='send-status';sendStatus.textContent=''; render(); }
  }

  function submit(){
    var full='';
    for(var i=0;i<steps.length;i++){
      var v=answers[i]||'';
      full+='Q'+(i+1)+'. '+QUESTIONS[i]+'\n答：'+(v||'（没写）')+'\n\n';
    }
    nextBtn.disabled=true;nextBtn.textContent='发送中…';
    sendStatus.className='send-status';sendStatus.textContent='';

    var payload={
      _subject:'【默契大测试】她答完啦 ❤',
      _captcha:'false',
      _template:'table',
      'Q1':answers[0],'Q2':answers[1],'Q3':answers[2],
      'Q4':answers[3],'Q5':answers[4],'Q6':answers[5],
      message:full
    };

    fetch(FORM_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(payload)
    }).then(function(r){return r.json();}).then(function(d){
      if(d && d.success==='false'){ throw new Error(d.message||'发送失败'); }
      confetti();
      show('s-done');
    }).catch(function(){
      sendStatus.className='send-status send-fail';
      sendStatus.textContent='咦，好像没送出去，再按一次试试。';
      nextBtn.disabled=false;nextBtn.textContent='答完了，送给你 💌';
    });
  }

  document.getElementById('startBtn').onclick=function(){
    cur=0;render();
    document.getElementById('s-step').scrollTop=0;
    show('s-step');
  };
  nextBtn.onclick=next;
  backBtn.onclick=back;

  document.getElementById('replayBtn').onclick=function(){
    cur=0;answers={};
    ansEl.value='';
    sendStatus.className='send-status';sendStatus.textContent='';
    nextBtn.disabled=false;
    show('s-intro');
  };

  // 登录判定：账号 + 密码
  var LOGIN_USER='徐洁';
  var LOGIN_PASS='20040915';
  document.getElementById('pwBtn').onclick=function(){
    var u=document.getElementById('userInput').value.trim();
    var p=document.getElementById('pwInput').value.trim();
    var msg=document.getElementById('pwMsg');
    if(u===LOGIN_USER && p===LOGIN_PASS){
      show('s-intro');
    }else{
      msg.className='send-status send-fail';
      msg.textContent='账号或密码不对哦，再想想～';
    }
  };

  show('s-login');

  // 注册 Service Worker
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
